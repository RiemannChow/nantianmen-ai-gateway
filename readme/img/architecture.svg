<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">nantianmen-ai-gateway — Connection Architecture</text>
  <text x="700" y="68" text-anchor="middle" font-size="14" fill="#94a3b8">Control plane that publishes policies to an Apinto data plane and integrates with AI, datastores, identity, and observability systems</text>

  <!-- Legend -->
  <g font-size="12" fill="#e2e8f0">
    <rect x="40" y="86" width="14" height="14" rx="3" fill="#059669"/><text x="60" y="97">Inbound</text>
    <rect x="140" y="86" width="14" height="14" rx="3" fill="#6d28d9"/><text x="160" y="97">Control Plane</text>
    <rect x="280" y="86" width="14" height="14" rx="3" fill="#8b5cf6"/><text x="300" y="97">Data Plane</text>
    <rect x="410" y="86" width="14" height="14" rx="3" fill="#2563eb"/><text x="430" y="97">Provider / Datastore</text>
    <rect x="600" y="86" width="14" height="14" rx="3" fill="#d97706"/><text x="620" y="97">Identity</text>
    <rect x="710" y="86" width="14" height="14" rx="3" fill="#0d9488"/><text x="730" y="97">Observability / Alerts</text>
  </g>

  <!-- ===== Edges (draw before nodes) ===== -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <!-- inbound -> hub -->
    <line x1="275" y1="150" x2="510" y2="270"/>
    <line x1="275" y1="290" x2="510" y2="330"/>
    <line x1="275" y1="430" x2="510" y2="380"/>
    <!-- hub -> apinto -->
    <line x1="850" y1="300" x2="1030" y2="210"/>
    <!-- apinto -> providers -->
    <line x1="1150" y1="310" x2="1150" y2="405"/>
    <line x1="1180" y1="310" x2="1180" y2="530"/>
    <line x1="1210" y1="310" x2="1210" y2="645"/>
    <!-- hub -> band -->
    <line x1="560" y1="445" x2="160" y2="756"/>
    <line x1="610" y1="445" x2="360" y2="756"/>
    <line x1="660" y1="445" x2="560" y2="756"/>
    <line x1="710" y1="445" x2="770" y2="756"/>
    <line x1="760" y1="445" x2="950" y2="756"/>
    <line x1="800" y1="445" x2="1190" y2="756"/>
  </g>

  <!-- NSQ dashed note -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="1210" y1="645" x2="1330" y2="730"/>
  </g>
  <text x="1335" y="725" font-size="11" fill="#94a3b8">NSQ ai-event</text>
  <text x="1335" y="740" font-size="11" fill="#94a3b8">→ ai-event-handler</text>

  <!-- ===== Inbound nodes (green) ===== -->
  <g>
    <rect x="25" y="115" width="250" height="70" rx="10" fill="#059669"/>
    <text x="150" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">API Consumers / AI Apps</text>
    <text x="150" y="166" text-anchor="middle" font-size="11" fill="#d1fae5">HTTP :8088 / :8089</text>

    <rect x="25" y="255" width="250" height="70" rx="10" fill="#059669"/>
    <text x="150" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MCP Clients</text>
    <text x="150" y="306" text-anchor="middle" font-size="11" fill="#d1fae5">SSE + Streamable HTTP</text>

    <rect x="25" y="395" width="250" height="70" rx="10" fill="#059669"/>
    <text x="150" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Stripe Webhooks</text>
    <text x="150" y="446" text-anchor="middle" font-size="11" fill="#d1fae5">payment callbacks</text>
  </g>

  <!-- ===== Hub (control plane) ===== -->
  <g>
    <rect x="515" y="240" width="330" height="205" rx="14" fill="url(#hub)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="680" y="278" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">nantianmen-ai-gateway</text>
    <text x="680" y="300" text-anchor="middle" font-size="13" fill="#ede9fe">Control Plane (Go)</text>
    <line x1="540" y1="316" x2="820" y2="316" stroke="#a78bfa" stroke-width="1"/>
    <text x="680" y="342" text-anchor="middle" font-size="12" fill="#ede9fe">HTTP API (gin) · MCP Server · Auth</text>
    <text x="680" y="362" text-anchor="middle" font-size="12" fill="#ede9fe">Monitor · CostOpt · Crypto</text>
    <text x="680" y="382" text-anchor="middle" font-size="12" fill="#ede9fe">AES-256-GCM secret store</text>
    <text x="680" y="412" text-anchor="middle" font-size="11" fill="#c4b5fd">admin :127.0.0.1:9464 → /metrics · /pprof · /healthz</text>
  </g>

  <!-- ===== Data plane (violet) ===== -->
  <g>
    <rect x="1030" y="155" width="300" height="155" rx="12" fill="#8b5cf6"/>
    <text x="1180" y="190" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Apinto Data Plane</text>
    <text x="1180" y="214" text-anchor="middle" font-size="11" fill="#ede9fe">policy / route publish</text>
    <text x="1180" y="232" text-anchor="middle" font-size="11" fill="#ede9fe">process-admin HTTP</text>
    <text x="1180" y="256" text-anchor="middle" font-size="11" fill="#ede9fe">rate-limit · circuit-break</text>
    <text x="1180" y="274" text-anchor="middle" font-size="11" fill="#ede9fe">canary · ai_formatter</text>

    <rect x="1020" y="407" width="300" height="64" rx="10" fill="#2563eb"/>
    <text x="1170" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Remote LLM Providers</text>
    <text x="1170" y="453" text-anchor="middle" font-size="11" fill="#dbeafe">40+ OpenAI-compatible (SSE)</text>

    <rect x="1035" y="530" width="290" height="60" rx="10" fill="#2563eb"/>
    <text x="1180" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Local Ollama</text>
    <text x="1180" y="575" text-anchor="middle" font-size="11" fill="#dbeafe">ai-provider/local executor</text>

    <rect x="1035" y="645" width="290" height="60" rx="10" fill="#2563eb"/>
    <text x="1180" y="670" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Upstream APIs</text>
    <text x="1180" y="690" text-anchor="middle" font-size="11" fill="#dbeafe">Kafka access-log (plugin)</text>
  </g>

  <!-- ===== Bottom band ===== -->
  <g>
    <rect x="60" y="756" width="200" height="64" rx="10" fill="#2563eb"/>
    <text x="160" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MySQL</text>
    <text x="160" y="802" text-anchor="middle" font-size="11" fill="#dbeafe">gorm (primary store)</text>

    <rect x="260" y="756" width="200" height="64" rx="10" fill="#2563eb"/>
    <text x="360" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Redis</text>
    <text x="360" y="802" text-anchor="middle" font-size="11" fill="#dbeafe">cache / KV</text>

    <rect x="460" y="756" width="200" height="64" rx="10" fill="#2563eb"/>
    <text x="560" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">InfluxDB v2</text>
    <text x="560" y="802" text-anchor="middle" font-size="11" fill="#dbeafe">time-series metrics</text>

    <rect x="660" y="756" width="210" height="64" rx="10" fill="#d97706"/>
    <text x="765" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Identity / SSO</text>
    <text x="765" y="802" text-anchor="middle" font-size="11" fill="#fef3c7">LDAP · Feishu OAuth</text>

    <rect x="880" y="756" width="200" height="64" rx="10" fill="#0d9488"/>
    <text x="980" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Observability</text>
    <text x="980" y="802" text-anchor="middle" font-size="11" fill="#ccfbf1">Prometheus · Loki · pprof</text>

    <rect x="1090" y="756" width="220" height="64" rx="10" fill="#0d9488"/>
    <text x="1200" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Alerts</text>
    <text x="1200" y="802" text-anchor="middle" font-size="11" fill="#ccfbf1">SMTP · Webhooks</text>
  </g>
</svg>
