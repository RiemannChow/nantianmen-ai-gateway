name: ci

on:
  push:
    branches: [main, main-github-pro]
  pull_request:
    branches: [main, main-github-pro]

jobs:
  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.12'
      - name: Pnpm install and build
        run: |
          npm install -g pnpm
          cd ./frontend
          pnpm install --registry https://registry.npmmirror.com
          pnpm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend-test:
    name: backend test
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...

  backend-lint:
    name: backend lint
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  security-scan:
    name: security scan
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: Govulncheck (report only)
        # 报告模式：输出依赖漏洞但不阻断 CI（漏洞库持续增长，标准库修复仅在新版 Go 中；
        # 硬门禁会随漏洞库更新持续失败）。需人工定期复查日志中的漏洞。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 || true
          govulncheck ./... || true
      - name: Gosec (report mode)
        # 暂不阻断：存量告警清理后移除 -no-fail
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -no-fail -fmt=text ./... || true

  frontend-test:
    name: frontend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.12'
      - name: Pnpm install, lint, test, build
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install --registry https://registry.npmmirror.com
          pnpm run lint
          pnpm test -- --ci
          ./node_modules/.bin/lerna run build --scope=core
      - name: Pnpm audit (report mode)
        # 暂不阻断：存量告警清理后改为硬门禁
        run: |
          cd frontend
          pnpm audit --audit-level=high || echo "::warning::pnpm audit reported vulnerabilities (see job log)"
