version: '3'
services:
  nantianmen-ai-gateway-mysql:
    image: mysql:8.0.37
    privileged: true
    restart: always
    container_name: nantianmen-ai-gateway-mysql
    hostname: nantianmen-ai-gateway-mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "33306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=nantianmen-ai-gateway
    volumes:
      - /var/lib/nantianmen-ai-gateway/mysql:/var/lib/mysql
    networks:
      - nantianmen-ai-gateway
  nantianmen-ai-gateway:
    image: apipark/apipark:v1.2.0-beta
    container_name: nantianmen-ai-gateway
    privileged: true
    restart: always
    networks:
      - nantianmen-ai-gateway
    ports:
      - "18288:8288"
    depends_on:
      - nantianmen-ai-gateway-mysql
    environment:
      - MYSQL_USER_NAME=root
      - MYSQL_PWD=123456
      - MYSQL_IP=nantianmen-ai-gateway-mysql
      - MYSQL_PORT=3306                 #mysql端口
      - MYSQL_DB="nantianmen-ai-gateway"
      - ERROR_DIR=work/logs  # 日志放置目录
      - ERROR_FILE_NAME=error.log          # 错误日志文件名
      - ERROR_LOG_LEVEL=info               # 错误日志等级,可选:panic,fatal,error,warning,info,debug,trace 不填或者非法则为info
      - ERROR_EXPIRE=7d                    # 错误日志过期时间，默认单位为天，d|天，h|小时, 不合法配置默认为7d
      - ERROR_PERIOD=day                  # 错误日志切割周期，仅支持day、hour
      - REDIS_ADDR=nantianmen-ai-gateway-redis:6379           #Redis集群地址 多个用,隔开
      - REDIS_PWD=123456                         # Redis密码
      - ADMIN_PASSWORD=12345678
  influxdb2:
    image: influxdb:2.6
    privileged: true
    restart: always
    container_name: influxdb2
    hostname: influxdb2
    ports:
      - "8086:8086"
    volumes:
      - /var/lib/nantianmen-ai-gateway/influxdb2:/var/lib/influxdb2
    networks:
      - nantianmen-ai-gateway
  nantianmen-ai-gateway-redis:
    container_name: nantianmen-ai-gateway-redis
    image: redis:7.2.4
    hostname: nantianmen-ai-gateway-redis
    privileged: true
    restart: always
    ports:
      - "6379:6379"
    command:
      - bash
      - -c
      - "redis-server --protected-mode yes --logfile redis.log --appendonly no --port 6379 --requirepass 123456"
    networks:
      - nantianmen-ai-gateway
  nantianmen-ai-gateway-apinto:
    image: eolinker/apinto-gateway
    container_name: nantianmen-ai-gateway-apinto
    privileged: true
    restart: always
    command: 
      - ./start.sh
    ports:
      - "8099:8099"
      - "9400:9400"
      - "9401:9401"
    volumes:
      - /var/lib/nantianmen-ai-gateway/apinto/data:/var/lib/apinto
      - /var/lib/nantianmen-ai-gateway/apinto/log:/var/log/apinto
      - ${PWD}/config.yml:/etc/apinto/config.yml
    networks:
      - nantianmen-ai-gateway
networks:
  nantianmen-ai-gateway:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.100.0.0/24
